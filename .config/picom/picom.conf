# General settings
round-borders = 1
round-borders-exclude = []

round-borders-rule = [
    "3:class_g = 'XTerm'",
    "3:class_g = 'URxvt'",
    "10:class_g = 'Alacritty'",
    "15:class_g = 'Signal'"
]

# Shadows settings
shadow = false
shadow-radius = 7
shadow-offset-x = -7
shadow-offset-y = -7

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Polybar'"
]

# Fading settings
fading = true
fade-in-step = 0.03
fade-out-step = 0.03
fade-exclude = []

# Opacity settings
inactive-opacity = 0.9
frame-opacity = 0.7
inactive-opacity-override = false
active-opacity = 1.0

focus-exclude = [
    "class_g = 'Cairo-clock'"
]

opacity-rule = [
    "100:class_g = 'XTerm'",
    "100:class_g = 'URxvt'",
    "100:class_g = 'kitty'",
    "100:class_g = 'Alacritty'",
    "80:class_g = 'Polybar'",
    "85:class_g = 'code-oss'",
    "100:class_g = 'Meld'",
    "70:class_g = 'TelegramDesktop'",
    "90:class_g = 'Joplin'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Thunderbird'",
    "85:class_g = 'jetbrains-pycharm-ce'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'popup_menu'",
    "100:window_type = 'tooltip'",
    "100:window_type = 'menu'"
]

# Blur settings
blur: {
    method = "dual_kawase"
    strength = 5
    background = false      
    background-frame = false
    background-fixed = false
    kern = "3x3box"
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'toolbar'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Transmission-gtk'",
  "class_g = 'Transmission-qt'",
  "class_g = 'Org.gnome.Nautilus'",
  "name ~= 'dropdown'",
  "name ~= 'popup'",
  "name ~= 'tooltip'"
]

# Experimental settings
experimental-backends = true
backend = "glx"
vsync = false

# Window focus and detection settings
mark-wmwin-focused = true
mark-ovredir-focused = true
detect-rounded-corners = true
detect-client-opacity = true
detect-transient = true
detect-client-leader = true
use-damage = true

# Logging level
log-level = "info"

# Window types configurations
wintypes: {
    normal = { fade = false; shadow = false; }
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; }
    dock = { shadow = false; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.8; }
    dropdown_menu = { opacity = 0.8; }
}



