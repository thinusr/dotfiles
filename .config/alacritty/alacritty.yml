# Alacritty Configuration - Gruvbox Nordic Style
# =============================================

window:
  opacity: 0.8
  dynamic_title: true

  padding:
    x: 0
    y: 0

scrolling:
  history: 10000
  multiplier: 3

font:
  normal:
    family: "FiraCode Nerd Font"
    style: Regular
  bold:
    style: Bold
  italic:
    style: Italic
  bold_italic:
    style: Bold Italic
  size: 10.0

cursor:
  style:
    shape: Block
  unfocused_hollow: true
  thickness: 0.15

colors:
  # Gruvbox Dark colors (matches your Kitty color scheme)
  primary:
    background: '0x282828'
    foreground: '0xebdbb2'

  normal:
    black:   '0x282828'
    red:     '0xcc241d'
    green:   '0x98971a'
    yellow:  '0xd79921'
    blue:    '0x458588'
    magenta: '0xb16286'
    cyan:    '0x689d6a'
    white:   '0xa89984'

  bright:
    black:   '0x928374'
    red:     '0xfb4934'
    green:   '0xb8bb26'
    yellow:  '0xfabd2f'
    blue:    '0x83a598'
    magenta: '0xd3869b'
    cyan:    '0x8ec07c'
    white:   '0xebdbb2'

key_bindings:
  - { key: C, mods: Control|Shift, action: Copy }
  - { key: V, mods: Control|Shift, action: Paste }

mouse:
  hide_when_typing: true

