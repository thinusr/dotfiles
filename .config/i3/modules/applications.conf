# Workspace 2 — LibreOffice
# --------------------------
#bindsym $mod+l exec --no-startup-id libreoffice
for_window [class="libreoffice"] move to workspace $ws2
assign [class="ONLYOFFICE"] $ws2

# Workspace 3 — Inkscape
# ----------------------
assign [class="Inkscape"] $ws3
bindsym $mod+i exec --no-startup-id inkscape

# Workspace 4 — Gimp
# ------------------
assign [class="Gimp"] $ws4
bindsym $mod+g exec --no-startup-id gimp

# Workspace 5 — Mailspring
# -------------------------
assign [class="Mailspring"] $ws5
bindsym $mod+m exec --no-startup-id mailspring --password-store="gnome-libsecret" %U

# Workspace 6 — empty
# -------------------

# Workspace 7 — WezTerm / Kitty
# -----------------------------
#assign [class="kitty"] $ws7
bindsym $mod+Return exec --no-startup-id kitty
bindsym $mod+Shift+n exec --no-startup-id ~/scripts/nvim-fuzzy/nvim-fuzzy.sh
bindsym $mod+n exec --no-startup-id kitty nvim

# Workspace 8 — Obsidian
# ----------------------
assign [class="obsidian"] $ws8
bindsym $mod+o exec --no-startup-id obsidian

# Workspace 9 — VSCODE
# --------------------
assign [class="code-oss"] $ws9
bindsym $mod+c exec --no-startup-id code

# Workspace 10 — PyCharm
# ----------------------
assign [class="jetbrains-pycharm-ce"] $ws10
bindsym $mod+p exec --no-startup-id /home/thinus/.local/share/JetBrains/Toolbox/apps/pycharm-community/bin/pycharm.sh
bindsym $mod+Shift+p workspace $ws10

# Workspace 11 — Thunar
# ---------------------
assign [class="Thunar"] $ws11
bindsym $mod+t exec --no-startup-id bash -c 'i3-msg workspace $ws11 && thunar'
#bindsym $mod+t exec --no-startup-id bash -c 'i3-msg workspace $ws11 && pcmanfm'
#bindsym $mod+t exec --no-startup-id bash -c 'i3-msg workspace $ws11 && gnome-commander'

# Workspace 12 — Transmission
