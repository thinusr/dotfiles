[global/wm]
;https://github.com/jaagr/polybar/wiki/Configuration#global-wm-settings
margin-top = 0
margin-bottom = 0

[settings]
;https://github.com/jaagr/polybar/wiki/Configuration#application-settings
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Define fallback values used by all module formats
format-foreground = #f8f8f2
format-background = #6632302f
format-underline =
format-overline =

[colors]
background = #6632302f
foreground = #f8f8f2
foreground-active = #458588
occupied = #f8f8f2
occupied-active = #458588
active = #458588
alert = #d79921
volume-min = #8ec07c
volume-med = #d79921
volume-max = #cc241d

[module/tray]
type = internal/tray

;format-margin = 8px
;tray-spacing = 8px
tray-size = 12
tray-padding = 3
tray-offset-x = -400
tray-offset-y = 0
tray-foreground = ${colors.foreground}
tray-background = ${colors.background}
format-background = ${colors.background}

################################################################################
################################################################################
############                         MAINBAR-I3                     ############
################################################################################
################################################################################

[bar/mainbar-i3]
;https://github.com/jaagr/polybar/wiki/Configuration

monitor = ${env:MONITOR}
monitor-fallback = HDMI-2
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true
width = 100%
height = 36
#offset-x = 2.5%
#offset-y = 3%

background = ${colors.background}
foreground = ${colors.foreground}

; Background gradient (vertical steps)
;   background-[0-9]+ = #aarrggbb
;background-0 =

radius = 5
line-size = 0
line-color = #000000

border-size = 0
;border-left-size = 25
;border-right-size = 25
;border-top-size = 0
;border-bottom-size = 25
border-color = #cc241d

padding-left = 2
padding-right = 2

module-margin-left = 1
module-margin-right = 1

;https://github.com/jaagr/polybar/wiki/Fonts
font-0 = "FantasqueSansMono Nerd Font:style=Italic:size=10;2"
font-1 = "Ubuntu Nerd Font:size=10.5;2"
font-2 = "Font Awesome 6 Brands:style=Regular:size=11;2"
font-3 = "FiraCode Nerd Font Propo:size=10;2"
font-4 = "Font Awesome 5 Free:style=Solid:size=11;2"
font-5 = "Font Awesome 5 Free:style=Regular:size=11;2"
font-6 = "Font Awesome 5 Brands:style=Regular:size=11;2"


modules-left = i3 xwindow 
modules-center = wifi networkspeedup networkspeeddown filesystem cpu2 memory cpu-temp-fan
modules-right = dropbox-status volume bluetooth battery date powermenu
separator = |

;dim-value = 1.0

#i3: Make the bar appear below windows
#wm-restack = i3
#override-redirect = false

; Enable support for inter-process messaging
; See the Messaging wiki page for more details.
enable-ipc = true

; Fallback click handlers that will be called if
; there's no matching module handler found.
click-left =
click-middle =
click-right =
scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev
double-click-left =
double-click-middle =
double-click-right =

; Requires polybar to be built with xcursor support (xcb-util-cursor)
; Possible values are:
; - default   : The default pointer as before, can also be an empty string (default)
; - pointer   : Typically in the form of a hand
; - ns-resize : Up and down arrows, can be used to indicate scrolling
cursor-click =
cursor-scroll =

################################################################################
################################################################################
############                       MODULE I3                        ############
################################################################################
################################################################################

[module/i3]
;https://github.com/jaagr/polybar/wiki/Module:-i3
type = internal/i3

; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = true

; This will split the workspace name on ':'
; Default: false
strip-wsnumbers = false

; Sort the workspaces by index instead of the default
; sorting that groups the workspaces by output
; Default: false
index-sort = false

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = true

; Wrap around when reaching the first/last workspace
; Default: true
wrapping-scroll = false

; Set the scroll cycle direction
; Default: true
reverse-scroll = false

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;󰣇
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-10 =11;
ws-icon-11 =12;
ws-icon-12 =13;󰣇
ws-icon-13 =14;󰣇
ws-icon-14 =15;
ws-icon-15 =16;󰣇
ws-icon-16 =17;󰣇
ws-icon-17 =18;󰣇
ws-icon-18 =19;
ws-icon-19 =20;
ws-icon-default = " 󰣇"

; Available tags:
;   <label-state> (default) - gets replaced with <label-(focused|unfocused|visible|urgent)>
;   <label-mode> (default)
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = #000000
label-mode-background = #d79921

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon%  %name%
; focused = Active workspace on focused monitor
label-focused = %icon% %index%
label-focused-background = ${colors.background}
label-focused-foreground = #d65d0e
#label-focused-underline = ${colors.foreground}
label-focused-padding = 2

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
; unfocused = Inactive workspace on any monitor
label-unfocused = %icon% %index%
label-unfocused-padding = 2
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.foreground}
#label-unfocused-underline = #003c3836

; visible = Active workspace on unfocused monitor
label-visible = %icon% %index%
label-visible-background = ${self.label-focused-background}
label-visible-underline = ${self.label-focused-underline}
label-visible-padding = 2

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
; urgent = Workspace with urgency hint set
label-urgent = %icon% %name%
label-urgent-background = ${self.label-focused-background}
label-urgent-foreground = #cc241d
label-urgent-padding = 2

#format-foreground = ${colors.foreground}
format-background = ${colors.background}

################################################################################
###############################################################################
############                       MODULES A-Z                      ############
################################################################################
################################################################################

[module/battery]
;https://github.com/jaagr/polybar/wiki/Module:-battery
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98

format-charging = <animation-charging> <label-charging>
label-charging =  %percentage%%
format-charging-foreground = ${colors.foreground}
format-charging-background = ${colors.background}
format-discharging = <ramp-capacity> <label-discharging>
label-discharging =  %percentage%%

format-discharging-foreground = ${colors.foreground}
format-discharging-background = ${colors.background}

format-full-prefix = " "
format-full-prefix-foreground = ${colors.foreground}
format-full-foreground = ${colors.foreground}
format-full-background = ${colors.background}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750

################################################################################

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = blueberry
label-foreground = ${colors.foreground}
format-background = ${colors.background}

#################################################################################

[module/cpu-temp-fan]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-temp-fan.sh
interval = 5
label = %output%
format-background = ${colors.background}

#################################################################################

[module/cpu2]
;https://github.com/jaagr/polybar/wiki/Module:-cpu
type = internal/cpu
; Seconds to sleep between updates
; Default: 1
interval = 1
format-background = ${colors.background}
format-prefix = " 龍 "
format-prefix-foreground = ${colors.foreground}

; Available tags:
;   <label> (default)
;   <bar-load>
;   <ramp-load>
;   <ramp-coreload>
format = <label>

format-padding = 0

; Available tokens:
;   %percentage% (default) - total cpu load
;   %percentage-cores% - load percentage for each core
;   %percentage-core[1-9]% - load percentage for specific core
label = %percentage:3%%

################################################################################

[module/date]
type = internal/date
interval = 5
date = " %Y-%m-%d%"
date-alt = " %d-%m-%Y"
time = %H:%M
time-alt = %H:%M
format-foreground = ${colors.foreground}
format-background = ${colors.background}
label = %date% %time%

#################################################################

[module/dropbox-status]
type = custom/script
exec = ~/.config/polybar/scripts/dropbox-ping.sh
interval = 900  ; 900 seconds = 15 minutes
label = %output%
format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = kitty --working-directory=$HOME/Dropbox
click-right = xdg-open https://www.dropbox.com

#################################################################

[module/filesystem]
type = internal/fs

; Mountpoints to display
mount-0 = /
;mount-1 = /home
;mount-2 = /var

; Seconds to sleep between updates
; Default: 30
interval = 30

; Display fixed precision values
; Default: false
fixed-values = false

; Spacing between entries
; Default: 2
spacing = 4

; Available tags:
;   <label-mounted> (default)
;   <bar-free>
;   <bar-used>
;   <ramp-capacity>
format-mounted = <label-mounted>
format-mounted-foreground = ${colors.foreground}
format-mounted-background = ${colors.background}

; Available tokens:
;   %mountpoint%
;   %type%
;   %fsname%
;   %percentage_free%
;   %percentage_used%
;   %total%
;   %free%
;   %used%
; Default: %mountpoint% %percentage_free%%
label-mounted =   %percentage_used%% / %total%

; Available tokens:
;   %mountpoint%
; Default: %mountpoint% is not mounted
label-unmounted = %mountpoint% not mounted
format-unmounted-foreground = ${colors.foreground}
format-unmounted-background = ${colors.background}

################################################################################

[module/memory]
;https://github.com/jaagr/polybar/wiki/Module:-memory
type = internal/memory
interval = 1
; Available tokens:
;   %percentage_used% (default)
;   %percentage_free%
;   %gb_used%
;   %gb_free%
;   %gb_total%
;   %mb_used%
;   %mb_free%
;   %mb_total%
label = %percentage_used%% / %gb_total%

format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.foreground}
format-foreground = ${colors.foreground}
format-background = ${colors.background}

################################################################################

[module/networkspeedup]
;https://github.com/jaagr/polybar/wiki/Module:-network
type = internal/network
interface = wlan0
label-connected = "%upspeed:7%"
format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-foreground = ${colors.foreground}
format-connected-foreground = ${colors.foreground}
format-connected-background = ${colors.background}

################################################################################

[module/networkspeeddown]
;https://github.com/jaagr/polybar/wiki/Module:-network
type = internal/network
interface = wlan0
label-connected = "%downspeed:7%"
format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-foreground = ${colors.foreground}
format-connected-foreground = ${colors.foreground}
format-connected-background = ${colors.background}

################################################################################

[module/powermenu]
type = custom/text
content = 
format-padding = 2
format-background = ${colors.background} 
click-left = ~/.config/i3/scripts/powermenu

#################################################################################

[module/spotify1]
;https://github.com/NicholasFeldman/dotfiles/blob/master/polybar/.config/polybar/spotify.sh
type = custom/script
exec = ~/.config/polybar/scripts/spotify1.sh
interval = 1

;format = <label>
#format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-padding = 2
format-underline = #8ec07c
format-prefix = "  "
format-prefix-foreground = #8ec07c
label = %output:0:150%

################################################################################

[module/spotify2]
;install zscroll
;https://github.com/PrayagS/polybar-spotify
type = custom/script
tail = true
format-prefix = "  "
format = <label>
#format-foreground = ${colors.foreground}
format-background = ${colors.background}
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh

[module/spotify-prev]
type = custom/script
exec = echo ""
format = <label>
#format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = playerctl previous spotify
click-right = spotify

[module/spotify-play-pause]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo ""
initial = 1
#format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = playerctl play-pause spotify
click-right = spotify

[module/spotify-next]
type = custom/script
exec = echo ""
format = <label>
#format-foreground = ${colors.foreground}
format-background = ${colors.background}
click-left = playerctl next spotify
click-right = spotify

################################################################################

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 900
label = %output%

#################################################################################
[module/volume]
type = internal/volume
use-wpctl = true
interval = 1 
format = <label-volume>
format-volume = <ramp-volume><label-volume>
format-volume-foreground = ${colors.foreground}
format-volume-background = ${colors.background}

label-volume = "  %percentage%%"
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = 󰢼
ramp-volume-1 = 󰢽
ramp-volume-2 = 󰢾

ramp-volume-foreground = ${colors.foreground}
ramp-volume-levels = 33 66

format-muted = <label-muted>
format-muted-foreground = ${colors.foreground}
format-muted-background = ${colors.background}

label-muted = 󰢿 Muted
label-muted-foreground = #cc241d
#label-muted-underline = #cc241d

scroll-up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 4%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 4%-

click-right = polybar-msg action "#volume-hook.0"
hook-0 = echo

#################################################################################

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 2

click-left = bash -c 'SSID=$(nmcli -t -f SSID dev wifi | rofi -dmenu); nmcli dev wifi connect "$SSID"'
click-right = nm-connection-editor

format-background = ${colors.background}

#################################################################################

[module/xwindow]
;https://github.com/jaagr/polybar/wiki/Module:-xwindow
type = internal/xwindow
label = %title%
label-maxlen = 50
format-foreground = ${colors.foreground}
format-background = ${colors.background}

#################################################################################













